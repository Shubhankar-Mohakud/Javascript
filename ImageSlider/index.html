<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="slider">
        <div class="slides">
            <img class="slide" src="./image1.jpg" alt="Image #1" width="500px">
            <img class="slide" src="./image2.jpg" alt="Image #2" width="500px">
            <img class="slide" src="./image3.jpg" alt="Image #3" width="500px">
        </div>
        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>
    </div>
    <script src="./index.js"></script>
</body>
</html>
